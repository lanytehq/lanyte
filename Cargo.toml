[workspace]
resolver = "2"
members = [
    "crates/lanyte-common",
    "crates/lanyte-mission",
    "crates/lanyte-telemetry",
    "crates/lanyte-gateway",
    "crates/lanyte-state",
    "crates/lanyte-llm",
    "crates/lanyte-executor",
    "crates/lanyte-orchestrator",
    "crates/lanyte-driver-codex",
]

[package]
name = "lanyte"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
base64 = "0.22"
bytes = "1"
ipcprims = { git = "https://github.com/3leaps/ipcprims", tag = "v0.2.0", version = "0.2.0", features = ["schema", "peer", "async"] }
lanyte-attest = { version = "0.1.0", git = "https://github.com/lanytehq/lanyte-attest", rev = "9645a315a297c77a5005ca57eb11b517f660fabf", default-features = false, features = ["verify"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
zeroize = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "json", "rustls", "stream"] }
futures-core = "0.3.31"
futures-util = "0.3.32"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "process", "io-util"] }
tokio-util = "0.7"
tokio-stream = "0.1.17"
sysprims-proc = { git = "https://github.com/3leaps/sysprims", tag = "v0.1.16" }
sysprims-signal = { git = "https://github.com/3leaps/sysprims", tag = "v0.1.16" }

[dependencies]
bytes = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
ipcprims = { workspace = true }
lanyte-driver-codex = { path = "crates/lanyte-driver-codex", version = "0.1.0" }
lanyte-common = { path = "crates/lanyte-common", version = "0.1.0" }
lanyte-gateway = { path = "crates/lanyte-gateway", version = "0.1.0" }
lanyte-llm = { path = "crates/lanyte-llm", version = "0.1.0" }
lanyte-mission = { path = "crates/lanyte-mission", version = "0.1.0" }
lanyte-orchestrator = { path = "crates/lanyte-orchestrator", version = "0.1.0" }
lanyte-state = { path = "crates/lanyte-state", version = "0.1.0" }
lanyte-telemetry = { path = "crates/lanyte-telemetry", version = "0.1.0" }
rustix = { version = "1", features = ["fs", "process"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
uuid = { version = "1", features = ["serde", "v4"] }
zeroize = { workspace = true }

[[test]]
name = "smoke"
path = "tests/integration/smoke.rs"
